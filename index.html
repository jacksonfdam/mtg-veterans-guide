<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

    theme: { extend: {
      colors: {
        void: '#0b0812', ink: '#120e1c', slate2: '#1b1727', slate3: '#262033', line: '#352d47',
        gold: { DEFAULT: '#c9a24b', soft: '#e3c77d', dim: '#8d7233' }, parch: '#e9e2d0', mute: '#a79fb8'

<style>
  :root { color-scheme: dark; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(94, 52, 140, .28), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(201, 162, 75, .07), transparent 60%),
      #0b0812;
    background-attachment: fixed;
  }
  ::selection { background: rgba(201,162,75,.35); }
  :focus-visible { outline: 2px solid #e3c77d; outline-offset: 3px; border-radius: 6px; }
  .gold-text { background: linear-gradient(180deg, #f1dc9c, #c9a24b 60%, #9a7a30); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, #c9a24b66, transparent); }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .panel { background: linear-gradient(180deg, rgba(38,32,51,.75), rgba(27,23,39,.85)); border: 1px solid #352d47; border-radius: 14px; transition: border-color .3s, transform .3s, box-shadow .3s; }
  .panel:hover { border-color: #8d723388; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -18px rgba(0,0,0,.8), 0 0 0 1px #c9a24b44; }
  .pip { display:inline-flex; width:1.35rem; height:1.35rem; border-radius:50%; align-items:center; justify-content:center; font:600 .7rem Inter; color:#111; box-shadow: inset 0 -2px 3px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.4); flex:none; }
  .pip-w{background:#f4efd6}.pip-u{background:#8ec1ea}.pip-b{background:#9b8fa6}.pip-r{background:#e8836a}.pip-g{background:#7fbf84}.pip-c{background:#cfcbd6}
  .pip-lg { width:3.25rem; height:3.25rem; font-size:1.1rem; cursor:pointer; transition: transform .25s, box-shadow .25s, opacity .25s; }
  .pip-lg:hover { transform: translateY(-3px); }
  .pip-lg[aria-pressed="true"] { box-shadow: 0 0 0 3px #0b0812, 0 0 0 5px #c9a24b, 0 0 24px #c9a24b88; }
  .pip-lg[aria-pressed="false"] { opacity:.55; }

  .opt { text-align:left; width:100%; padding:1rem 1.15rem; border-radius:12px; border:1px solid #352d47; background: rgba(18,14,28,.7); color:#e9e2d0; transition: all .25s ease; cursor:pointer; }
  .opt:hover { border-color:#c9a24b; background: rgba(201,162,75,.08); transform: translateX(4px); }
  .opt[aria-pressed="true"] { border-color:#c9a24b; background: rgba(201,162,75,.16); }
  .step { animation: stepIn .45s ease both; }
  @keyframes stepIn { from { opacity:0; transform: translateX(24px);} to {opacity:1; transform:none;} }

  .tl-scroll { scrollbar-width: thin; scrollbar-color: #8d7233 #1b1727; scroll-snap-type: x proximity; scroll-padding-left: 1.25rem; }
  .tl-scroll::-webkit-scrollbar { height: 8px; }
  .tl-scroll::-webkit-scrollbar-track { background:#1b1727; border-radius: 99px; }
  .tl-scroll::-webkit-scrollbar-thumb { background:#8d7233; border-radius: 99px; }
  .tl-item { flex: 0 0 300px; width: 300px; overflow: hidden; scroll-snap-align: start; transition: flex-basis .6s ease, width .6s ease, opacity .45s ease, margin .6s ease, transform .6s ease; margin-right: 1.25rem; }
  .tl-item > .inner { width: 300px; }
  .tl-item.cross-hidden { flex-basis: 0; width: 0; opacity: 0; margin-right: 0; transform: scale(.9); pointer-events: none; }
  .tl-line { position:absolute; left:0; right:0; top: 14px; height:1px; background: linear-gradient(90deg, #c9a24b00, #c9a24b99 6%, #c9a24b99 94%, #c9a24b00); }
  .tl-dot { width:29px; height:29px; border-radius:50%; background:#120e1c; border:2px solid #c9a24b; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:#e3c77d; position:relative; z-index:1; }
  .tl-item.cross .tl-dot { border-color:#a678e0; color:#cfb2ff; box-shadow: 0 0 14px #a678e066; }
  .tl-item.cross .card-edge { border-color:#6b4aa0aa; background: linear-gradient(180deg, rgba(70,40,110,.35), rgba(27,23,39,.9)); }

  .switch { position:relative; width:52px; height:30px; border-radius:99px; background:#352d47; transition: background .3s; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#e9e2d0; transition: transform .3s; }
  [aria-checked="true"] > .switch { background:#c9a24b; }
  [aria-checked="true"] > .switch::after { transform: translateX(22px); background:#120e1c; }

  .mtg-card { background: linear-gradient(160deg,#2a2236,#17121f); border:6px solid #0a0710; border-radius: 16px; box-shadow: 0 0 0 1px #c9a24b55, 0 20px 40px -20px #000; }
  .hot { position:relative; cursor:pointer; transition: background .25s, box-shadow .25s; border-radius:8px; }
  .hot:hover, .hot.on { background: rgba(201,162,75,.18); box-shadow: 0 0 0 1px #c9a24b; }
  .chip { transition: all .25s; cursor:pointer; border:1px solid #352d47; border-radius:10px; }
  .chip:hover, .chip.on, .chip[aria-selected="true"] { background: rgba(201,162,75,.16); border-color:#c9a24b; color:#f1dc9c; }
  .stack-item { animation: pop .35s ease both; }
  @keyframes pop { from { opacity:0; transform: translateY(-14px) scale(.96);} to { opacity:1; transform:none; } }
  .stack-out { animation: out .35s ease both; }
  @keyframes out { to { opacity:0; transform: translateX(40px);} }

  /* simulator */
  .gc { width: 74px; height: 100px; border-radius: 9px; border:1px solid #4a4062; background: linear-gradient(165deg,#2e2640,#191422); padding:5px 6px; display:flex; flex-direction:column; justify-content:space-between; text-align:left; font-size:10px; line-height:1.15; color:#e9e2d0; transition: transform .25s, box-shadow .25s, opacity .25s, border-color .25s; position:relative; flex:none; }
  button.gc { cursor:pointer; }
  button.gc:hover { border-color:#c9a24b; transform: translateY(-4px); }
  .gc.land { background: linear-gradient(165deg,#3a3320,#1c1810); }
  .gc.burn { background: linear-gradient(165deg,#4a2420,#1f1210); }
  .gc.fly { background: linear-gradient(165deg,#22384d,#131c26); }
  .gc.dim { opacity:.45; }
  .gc.tapped { transform: rotate(9deg); opacity:.6; }
  .gc.sel { border-color:#e3c77d; box-shadow: 0 0 0 2px #c9a24b, 0 0 18px #c9a24b88; transform: translateY(-8px); }
  .gc.atk { border-color:#ff8f7a; box-shadow: 0 0 0 2px #e8836a, 0 0 18px #e8836a88; }
  .gc .pt { align-self:flex-end; font-weight:600; font-size:12px; color:#e3c77d; }
  .gc .tag { position:absolute; top:-8px; right:-6px; background:#0b0812; border:1px solid #c9a24b; border-radius:99px; padding:1px 6px; font-size:9px; color:#e3c77d; }
  .zone { min-height:112px; border:1px dashed #352d47; border-radius:12px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .sbtn { padding:.55rem .9rem; border-radius:10px; font-size:.8rem; font-weight:600; transition: all .2s; }
  .sbtn-p { background:#c9a24b; color:#0b0812; } .sbtn-p:hover { background:#e3c77d; }
  .sbtn-s { border:1px solid #352d47; } .sbtn-s:hover { border-color:#c9a24b; color:#e3c77d; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .reveal { opacity:1; transform:none; }
  }
</style>
</head>
<body class="font-sans text-parch antialiased">

<header class="sticky top-0 z-50 backdrop-blur-md bg-void/75 border-b border-line/60">
  <nav class="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between gap-4">
    <a href="#top" class="font-display tracking-widest text-gold-soft text-xs sm:text-sm flex items-center gap-2 whitespace-nowrap">
      <span class="pip pip-c" aria-hidden="true">✦</span> <span data-t="brand"></span>
    </a>
    <div class="hidden lg:flex items-center gap-5 text-sm text-mute">
      <a class="hover:text-gold-soft transition" href="#quiz" data-t="nQuiz"></a>
      <a class="hover:text-gold-soft transition" href="#timeline" data-t="nTime"></a>
      <a class="hover:text-gold-soft transition" href="#lore" data-t="nLore"></a>
      <a class="hover:text-gold-soft transition" href="#planes" data-t="nPlanes"></a>
      <a class="hover:text-gold-soft transition" href="#colors" data-t="nColors"></a>
      <a class="hover:text-gold-soft transition" href="#guide" data-t="nGuide"></a>

      <button data-lang="en" class="langBtn px-3 py-1.5 transition">EN</button>
      <button data-lang="pt" class="langBtn px-3 py-1.5 transition">PT</button>

  </nav>
</header>

<main id="top">

<!-- HERO -->
<section class="relative overflow-hidden">
  <div class="max-w-4xl mx-auto px-5 pt-20 pb-24 sm:pt-28 sm:pb-32 text-center">
    <div class="flex justify-center gap-2 mb-8" aria-hidden="true">
      <span class="pip pip-w">W</span><span class="pip pip-u">U</span><span class="pip pip-b">B</span><span class="pip pip-r">R</span><span class="pip pip-g">G</span>
    </div>
    <h1 class="font-display font-semibold text-3xl sm:text-5xl lg:text-6xl leading-tight gold-text" data-t="h1"></h1>
    <p class="font-serif italic text-2xl sm:text-4xl mt-3 text-parch" data-t="h1b"></p>
    <p class="mt-8 text-mute max-w-2xl mx-auto leading-relaxed text-base sm:text-lg" data-t="heroSub"></p>
    <a href="#quiz" class="go inline-block mt-10 px-8 py-4 rounded-xl font-semibold text-void bg-gradient-to-b from-gold-soft to-gold hover:from-[#f3dd9d] hover:to-gold-soft shadow-[0_10px_30px_-10px_rgba(201,162,75,.7)] hover:-translate-y-0.5 transition" data-t="cta"></a>
    <p class="mt-5 text-xs text-mute/80 tracking-wide" data-t="ctaSub"></p>
  </div>
  <div class="rule"></div>
</section>

<!-- QUIZ -->
<section id="quiz" class="max-w-3xl mx-auto px-5 py-20 sm:py-28 scroll-mt-14">
  <div class="text-center mb-10 reveal">
    <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="qK"></p>
    <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="qH"></h2>
  </div>
  <div class="panel p-6 sm:p-9 reveal" aria-live="polite">
    <div class="flex items-center gap-3 mb-7" aria-hidden="true">
      <div class="flex-1 h-1.5 rounded-full bg-slate3 overflow-hidden"><div id="bar" class="h-full bg-gold transition-all duration-500" style="width:0%"></div></div>
      <span id="stepLabel" class="text-xs text-mute tabular-nums"></span>
    </div>
    <div id="quizBody"></div>
  </div>
</section>

<!-- TIMELINE -->
<section id="timeline" class="py-20 sm:py-28 bg-ink/60 border-y border-line/50 scroll-mt-14">
  <div class="max-w-6xl mx-auto px-5">
    <div class="text-center mb-10 reveal">
      <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="tK"></p>
      <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="tH"></h2>
      <p class="text-mute mt-4 max-w-xl mx-auto" data-t="tSub"></p>
    </div>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 reveal">
      <button id="crossToggle" role="switch" aria-checked="false" class="flex items-center gap-4 panel px-5 py-3 hover:border-gold transition text-left">
        <span class="switch" aria-hidden="true"></span>
        <span class="text-sm sm:text-base font-medium" data-t="tToggle"></span>
      </button>
      <span id="tlCount" class="text-xs text-mute tabular-nums"></span>
    </div>
    <div class="relative reveal">
      <div class="flex justify-end gap-2 mb-4">
        <button id="tlPrev" aria-label="Previous" class="w-10 h-10 rounded-full bg-void/90 border border-line hover:border-gold hover:text-gold-soft transition">‹</button>
        <button id="tlNext" aria-label="Next" class="w-10 h-10 rounded-full bg-void/90 border border-line hover:border-gold hover:text-gold-soft transition">›</button>
      </div>
      <div id="tlScroll" class="tl-scroll overflow-x-auto pb-6 -mx-5 px-5" tabindex="0" aria-label="Timeline">
        <div class="relative flex w-max pt-1" id="tlTrack"></div>
      </div>
    </div>
  </div>
</section>

<!-- LORE -->
<section id="lore" class="max-w-6xl mx-auto px-5 py-20 sm:py-28 scroll-mt-14">
  <div class="text-center mb-10 reveal">
    <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="lK"></p>
    <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="lH"></h2>
    <p class="text-mute mt-4 max-w-2xl mx-auto" data-t="lSub"></p>

  <div id="loreGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
  <p class="text-center text-sm text-mute mt-8"><a class="underline decoration-gold/50 hover:text-gold-soft" href="https://magic.wizards.com/en/story" target="_blank" rel="noopener" data-t="lMore"></a></p>
</section>

<!-- PLANES & PLANESWALKERS -->
<section id="planes" class="py-20 sm:py-28 bg-ink/60 border-y border-line/50 scroll-mt-14">
  <div class="max-w-6xl mx-auto px-5">
    <div class="text-center mb-12 reveal">
      <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="pK"></p>
      <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="pH"></h2>
      <p class="text-mute mt-4 max-w-2xl mx-auto" data-t="pSub"></p>
    </div>
    <div id="pwFacts" class="grid gap-5 md:grid-cols-3 mb-12"></div>
    <div class="grid gap-8 lg:grid-cols-2">
      <div class="reveal">
        <h3 class="font-display text-xl text-gold-soft mb-4" data-t="pPlanes"></h3>
        <div id="planeChips" class="flex flex-wrap gap-2 mb-4"></div>
        <div id="planeBody" class="panel p-6 min-h-[170px]"></div>
      </div>
      <div class="reveal">
        <h3 class="font-display text-xl text-gold-soft mb-4" data-t="pWalkers"></h3>
        <div id="walkerList" class="grid sm:grid-cols-2 gap-3"></div>
      </div>
    </div>
  </div>
</section>

<!-- COLORS -->
<section id="colors" class="max-w-5xl mx-auto px-5 py-20 sm:py-28 scroll-mt-14">
  <div class="text-center mb-10 reveal">
    <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="cK"></p>
    <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="cH"></h2>
    <p class="text-mute mt-4 max-w-2xl mx-auto" data-t="cSub"></p>
  </div>
  <div class="panel p-6 sm:p-9 reveal">
    <div id="colorPips" class="flex justify-center gap-4 sm:gap-6 mb-8"></div>
    <div id="colorBody" class="min-h-[190px]" aria-live="polite"></div>
  </div>
</section>

<!-- GUIDE -->
<section id="guide" class="py-20 sm:py-28 bg-ink/60 border-y border-line/50 scroll-mt-14">
  <div class="max-w-6xl mx-auto px-5">
    <div class="text-center mb-14 reveal">
      <p class="text-gold text-xs tracking-[.3em] uppercase mb-3" data-t="gK"></p>
      <h2 class="font-display text-2xl sm:text-4xl text-parch" data-t="gH"></h2>
      <p class="text-mute mt-4 max-w-xl mx-auto" data-t="gSub"></p>
    </div>
    <div class="grid gap-6 lg:grid-cols-2">

      <article class="panel p-6 sm:p-8 reveal">
        <h3 class="font-display text-xl text-gold-soft mb-1" data-t="g1"></h3>
        <p class="text-mute text-sm mb-6" data-t="g1s"></p>
        <div class="grid sm:grid-cols-[210px_1fr] gap-6 items-start">
          <div class="mtg-card p-3 w-[210px] mx-auto text-[11px] select-none" id="anatomyCard">
            <div class="flex justify-between items-center gap-1 bg-slate3/70 rounded-lg">
              <button class="hot px-2 py-1.5 font-display text-[12px] flex-1 text-left" data-a="name" data-t="aName"></button>
              <button class="hot flex gap-0.5 px-1.5 py-1.5" data-a="cost" aria-label="Mana cost"><span class="pip pip-c" style="width:1.1rem;height:1.1rem">2</span><span class="pip pip-u" style="width:1.1rem;height:1.1rem">U</span></button>
            </div>
            <div class="my-2 h-20 rounded bg-gradient-to-br from-[#3a2a5c] to-[#1a2a44] flex items-center justify-center text-3xl" aria-hidden="true">🔮</div>
            <button class="hot block w-full text-left px-2 py-1 bg-slate3/70" data-a="type" data-t="aType"></button>
            <button class="hot block w-full text-left mt-2 px-2 py-2 bg-parch/10 min-h-[58px] leading-snug" data-a="text" data-t="aText"></button>
            <div class="flex justify-end mt-2"><button class="hot px-2 py-0.5 bg-slate3/90 font-semibold" data-a="pt">2/2</button></div>
          </div>
          <div id="anatomyInfo" class="text-sm leading-relaxed min-h-[180px]"></div>
        </div>
      </article>

      <article class="panel p-6 sm:p-8 reveal">
        <h3 class="font-display text-xl text-gold-soft mb-1" data-t="g2"></h3>
        <p class="text-mute text-sm mb-5" data-t="g2s"></p>
        <div id="typeChips" class="flex flex-wrap gap-2 mb-5"></div>
        <div id="typeBody" class="text-sm leading-relaxed min-h-[190px]"></div>
      </article>

      <article class="panel p-6 sm:p-8 reveal">
        <h3 class="font-display text-xl text-gold-soft mb-1" data-t="g3"></h3>
        <p class="text-mute text-sm mb-5" data-t="g3s"></p>

        <div class="rule mb-5"></div>
        <h4 class="font-semibold text-parch mb-1" data-t="stH"></h4>
        <p class="text-mute text-sm mb-4" data-t="stS"></p>
        <div id="spellBtns" class="flex flex-wrap gap-2 mb-4"></div>
        <ol id="stack" class="flex flex-col gap-1.5 min-h-[120px] p-3 rounded-lg bg-void/60 border border-line/70 text-sm" aria-live="polite"></ol>
        <p id="stackMsg" class="text-xs text-mute mt-3 min-h-[18px]"></p>
      </article>

      <div class="grid gap-6">
        <article class="panel p-6 sm:p-8 reveal">
          <h3 class="font-display text-xl text-gold-soft mb-1" data-t="g4"></h3>

          <div role="tablist" class="flex flex-wrap gap-2 mb-5" id="zoneTabs"></div>
          <div id="zoneBody" class="text-sm leading-relaxed min-h-[120px]"></div>
        </article>
        <article class="panel p-6 sm:p-8 reveal">
          <h3 class="font-display text-xl text-gold-soft mb-1" data-t="g5"></h3>
          <p class="text-mute text-sm mb-5" data-t="g5s"></p>
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="rounded-xl border border-line p-4 bg-void/40">
              <p class="font-semibold mb-2" data-t="ctH"></p>
              <p class="text-mute text-xs leading-relaxed mb-4" data-t="ctS"></p>

                <button id="cMinus" aria-label="-" class="w-8 h-8 rounded-full border border-line hover:border-gold transition">−</button>

                  <div class="font-display text-[10px] text-mute" data-t="bear"></div>
                  <div id="cStat" class="text-xl font-semibold text-gold-soft">2/2</div>
                  <div id="cDots" class="flex justify-center flex-wrap gap-0.5 mt-1 min-h-[10px]"></div>
                </div>
                <button id="cPlus" aria-label="+" class="w-8 h-8 rounded-full border border-line hover:border-gold transition">+</button>
              </div>
            </div>
            <div class="rounded-xl border border-line p-4 bg-void/40">

  /* =========================================================

  const CARDS = {

    else if (act === "cancel") G.target = null;
    else if (act === "face" && G.target !== null) shockAt("face");
    else if (act === "foe") {
      const c = find(G.bot, v);
      if (G.target !== null) shockAt(c);
      else if (G.phase === "block" && G.pick) {
        const blocker = find(G.you, G.pick);
        if (!canBlock(blocker, c)) G.msg = ["That creature has flying: only a flyer can block it.", "Essa criatura voa: só um voador pode bloqueá-la."];
        else { Object.keys(G.blocks).forEach(k => { if (G.blocks[k] === blocker) delete G.blocks[k]; }); G.blocks[c.id] = blocker; G.msg = null; }
        G.pick = null;
      }
    }
    else if (act === "mine") {
      if (G.phase === "attack") { G.sel.has(+v) ? G.sel.delete(+v) : G.sel.add(+v); }
      else if (G.phase === "block") {
        const c = find(G.you, v), cur = Object.keys(G.blocks).find(k => G.blocks[k] === c);
        if (cur) { delete G.blocks[cur]; G.pick = null; } else G.pick = G.pick === +v ? null : +v;
      }
    }
    else if (act === "combat") { G.phase = "attack"; G.msg = null; }
    else if (act === "attack") doAttack();
    else if (act === "end") { G.sel.clear(); drawSim(); return botTurn(); }
    else if (act === "confirm") {
      G.busy = true;
      resolveCombat(G.atk, G.blocks, "you"); G.atk = []; G.blocks = {}; G.pick = null; G.msg = null;
      return endBot();
    }
    drawSim();
  });

  /* =========================================================
     LANGUAGE + BOOT
  ========================================================= */
  function renderAll() {
    document.documentElement.lang = li ? "pt-BR" : "en";
    document.title = tr(["Multiverse, No Nonsense — Magic for returning veterans", "Multiverso Sem Enrolação — Magic para veteranos"]);
    $$("[data-t]").forEach(el => { el.innerHTML = tr(S[el.dataset.t]); });
    $$(".langBtn").forEach(b => {
      const on = (b.dataset.lang === "pt") === !!li;
      b.setAttribute("aria-pressed", String(on));
      b.className = "langBtn px-3 py-1.5 transition " + (on ? "bg-gold text-void" : "text-mute hover:text-gold-soft");
    });
    renderTimeline(); renderQuiz(); renderLore(); renderPlanes(); renderColors();
    renderAnat(); renderTypes(); renderPhases(); renderStack(); renderZones(); drawCounters(); renderThen();
    renderFormats(); renderStart(); drawSim();
    $$(".reveal").forEach(observe);
  }
  $$(".langBtn").forEach(b => b.addEventListener("click", () => {
    li = b.dataset.lang === "pt" ? 1 : 0;
    try { localStorage.setItem("mtgLang", li ? "pt" : "en"); } catch (e) {}
    renderAll();
  }));
  document.addEventListener("click", e => {
    const a = e.target.closest("a.go"); if (!a) return;
    e.preventDefault();
    $(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
  });

  newGame();
  renderAll();
})();
</script>
