<style>
  :root { color-scheme: dark; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(94, 52, 140, .28), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(201, 162, 75, .07), transparent 60%),
      #0b0812;
    background-attachment: fixed;
  }
  ::selection { background: rgba(201,162,75,.35); }
  :focus-visible { outline: 2px solid #e3c77d; outline-offset: 3px; border-radius: 6px; }
  .gold-text { background: linear-gradient(180deg, #f1dc9c, #c9a24b 60%, #9a7a30); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, #c9a24b66, transparent); }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .panel { background: linear-gradient(180deg, rgba(38,32,51,.75), rgba(27,23,39,.85)); border: 1px solid #352d47; border-radius: 14px; transition: border-color .3s, transform .3s, box-shadow .3s; }
  .panel:hover { border-color: #8d723388; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -18px rgba(0,0,0,.8), 0 0 0 1px #c9a24b44; }
  .pip { display:inline-flex; width:1.35rem; height:1.35rem; border-radius:50%; align-items:center; justify-content:center; font:600 .7rem Inter; color:#111; box-shadow: inset 0 -2px 3px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.4); flex:none; }
  .pip-w{background:#f4efd6}.pip-u{background:#8ec1ea}.pip-b{background:#9b8fa6}.pip-r{background:#e8836a}.pip-g{background:#7fbf84}.pip-c{background:#cfcbd6}
  .pip-lg { width:3.25rem; height:3.25rem; font-size:1.1rem; cursor:pointer; transition: transform .25s, box-shadow .25s, opacity .25s; }
  .pip-lg:hover { transform: translateY(-3px); }
  .pip-lg[aria-pressed="true"] { box-shadow: 0 0 0 3px #0b0812, 0 0 0 5px #c9a24b, 0 0 24px #c9a24b88; }
  .pip-lg[aria-pressed="false"] { opacity:.55; }

  .opt { text-align:left; width:100%; padding:1rem 1.15rem; border-radius:12px; border:1px solid #352d47; background: rgba(18,14,28,.7); color:#e9e2d0; transition: all .25s ease; cursor:pointer; }
  .opt:hover { border-color:#c9a24b; background: rgba(201,162,75,.08); transform: translateX(4px); }
  .opt[aria-pressed="true"] { border-color:#c9a24b; background: rgba(201,162,75,.16); }
  .step { animation: stepIn .45s ease both; }
  @keyframes stepIn { from { opacity:0; transform: translateX(24px);} to {opacity:1; transform:none;} }

  .tl-scroll { scrollbar-width: thin; scrollbar-color: #8d7233 #1b1727; scroll-snap-type: x proximity; scroll-padding-left: 1.25rem; }
  .tl-scroll::-webkit-scrollbar { height: 8px; }
  .tl-scroll::-webkit-scrollbar-track { background:#1b1727; border-radius: 99px; }
  .tl-scroll::-webkit-scrollbar-thumb { background:#8d7233; border-radius: 99px; }
  .tl-item { flex: 0 0 300px; width: 300px; overflow: hidden; scroll-snap-align: start; transition: flex-basis .6s ease, width .6s ease, opacity .45s ease, margin .6s ease, transform .6s ease; margin-right: 1.25rem; }
  .tl-item > .inner { width: 300px; }
  .tl-item.cross-hidden { flex-basis: 0; width: 0; opacity: 0; margin-right: 0; transform: scale(.9); pointer-events: none; }
  .tl-line { position:absolute; left:0; right:0; top: 14px; height:1px; background: linear-gradient(90deg, #c9a24b00, #c9a24b99 6%, #c9a24b99 94%, #c9a24b00); }
  .tl-dot { width:29px; height:29px; border-radius:50%; background:#120e1c; border:2px solid #c9a24b; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:#e3c77d; position:relative; z-index:1; }
  .tl-item.cross .tl-dot { border-color:#a678e0; color:#cfb2ff; box-shadow: 0 0 14px #a678e066; }
  .tl-item.cross .card-edge { border-color:#6b4aa0aa; background: linear-gradient(180deg, rgba(70,40,110,.35), rgba(27,23,39,.9)); }

  .switch { position:relative; width:52px; height:30px; border-radius:99px; background:#352d47; transition: background .3s; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#e9e2d0; transition: transform .3s; }
  [aria-checked="true"] > .switch { background:#c9a24b; }
  [aria-checked="true"] > .switch::after { transform: translateX(22px); background:#120e1c; }

  .mtg-card { background: linear-gradient(160deg,#2a2236,#17121f); border:6px solid #0a0710; border-radius: 16px; box-shadow: 0 0 0 1px #c9a24b55, 0 20px 40px -20px #000; }
  .hot { position:relative; cursor:pointer; transition: background .25s, box-shadow .25s; border-radius:8px; }
  .hot:hover, .hot.on { background: rgba(201,162,75,.18); box-shadow: 0 0 0 1px #c9a24b; }
  .chip { transition: all .25s; cursor:pointer; border:1px solid #352d47; border-radius:10px; }
  .chip:hover, .chip.on, .chip[aria-selected="true"] { background: rgba(201,162,75,.16); border-color:#c9a24b; color:#f1dc9c; }
  .stack-item { animation: pop .35s ease both; }
  @keyframes pop { from { opacity:0; transform: translateY(-14px) scale(.96);} to { opacity:1; transform:none; } }
  .stack-out { animation: out .35s ease both; }
  @keyframes out { to { opacity:0; transform: translateX(40px);} }

  /* classic 1993-2003 card frame (anatomy) */
  .oc { background:#e9e4d6; border-radius:13px; padding:11px; box-shadow: 0 22px 44px -20px #000, 0 0 0 1px rgba(0,0,0,.4); }
  .oc-frame { background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 5px), linear-gradient(160deg,#3b3735,#1b1918 55%,#2d2a28); border-radius:4px; padding:6px 8px 5px; color:#f3efe6; font-family:"Cormorant Garamond", Georgia, serif; }
  .oc-name { font-weight:700; font-size:17px; line-height:1.3; text-shadow:1px 1px 0 #000; }
  .oc .oc-art.hot { height:148px; border:2px solid; border-color:#0c0b0b #6f6866 #6f6866 #0c0b0b; border-radius:0; overflow:hidden;
    background: radial-gradient(60% 50% at 50% 70%, #55633a 0, transparent 70%), radial-gradient(34% 30% at 50% 46%, rgba(201,185,138,.3) 0, transparent 70%), linear-gradient(#2a1f33,#131912); }
  .oc-type { font-weight:600; font-size:13px; line-height:1.2; padding:4px 3px; text-shadow:1px 1px 0 #000; }
  .oc .oc-text.hot { background: linear-gradient(#d2cbbd,#b8b0a1); color:#141210; border:2px solid; border-color:#0c0b0b #6f6866 #6f6866 #0c0b0b; border-radius:0; padding:8px 9px; min-height:96px; font-size:13.5px; line-height:1.18; font-weight:500; }
  .oc-artist { font-size:10.5px; font-weight:600; }
  .oc-pt { font-size:21px; font-weight:700; line-height:1; text-shadow:1px 1px 0 #000; }
  .oc .hot:hover, .oc .hot.on { box-shadow: 0 0 0 2px #e3c77d, 0 0 16px rgba(201,162,75,.8); }

  .oc-real { border-radius:13px; padding:10px; box-shadow: 0 22px 44px -20px #000, 0 0 0 1px rgba(0,0,0,.4); background:#e9e4d6; }
  .oc-img { position:relative; aspect-ratio:200/285; border-radius:4px; overflow:hidden; }
  .oc-real img { display:block; width:100%; height:100%; }
  .hs { position:absolute; border-radius:4px; }
  .hs:hover, .hs.on { background: rgba(227,199,125,.2); box-shadow: 0 0 0 2px #e3c77d, 0 0 14px rgba(201,162,75,.85); }

  /* color wheel */
  .wheel-btn { position:absolute; margin:-26px 0 0 -26px; }
  .mx td, .mx th { padding:.45rem .5rem; text-align:center; border-bottom:1px solid #352d47; }
  .mx td:first-child, .mx th:first-child { text-align:left; }
  .lv2 { color:#e3c77d; } .lv1 { color:#8d7233; } .lv0 { color:#4a4062; }

  /* sets */
  .set-tile { display:flex; align-items:center; gap:.7rem; padding:.55rem .7rem; border:1px solid #352d47; border-radius:10px; background:rgba(18,14,28,.6); transition: border-color .2s, background .2s, transform .2s; }
  .set-tile:hover { border-color:#c9a24b; background:rgba(201,162,75,.08); transform: translateY(-2px); }
  .set-code { flex:none; min-width:3.1rem; text-align:center; font: 600 .68rem ui-monospace, SFMono-Regular, Menlo, monospace; padding:.25rem .3rem; border-radius:6px; background:#262033; color:#e3c77d; border:1px solid #352d47; }
  .set-tile.ub .set-code { color:#cfb2ff; border-color:#6b4aa0; }

  /* simulator */
  /* simulator: game-client table */
  .mt { display:grid; gap:8px; grid-template-columns:minmax(0,1fr); background:#07080c; border:1px solid #2a2f3a; border-radius:10px; padding:8px; }
  .mt-side { display:grid; grid-template-columns:1fr 1fr; gap:8px; grid-template-areas:"opp you" "log log"; }
  .mt-side > .mt-player:first-child { grid-area:opp; } .mt-side > .mt-player { grid-area:you; }
  .mt-log { grid-area:log; } .mt-gy { display:none; }
  .mt-main { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .mt-player { background:#0d1018; border:2px solid #2a3140; border-radius:8px; padding:5px; text-align:center; }
  .mt-player.active { border-color:#3b82f6; box-shadow:0 0 12px #3b82f655; }
  .mt-player.target { border-color:#e3c77d; animation: mtPulse 1.2s infinite; }
  @keyframes mtPulse { 50% { box-shadow:0 0 16px #e3c77dcc; } }
  .mt-player button:disabled { cursor:default; }
  .mt-avatar { position:relative; display:flex; align-items:center; justify-content:center; height:84px; border-radius:5px; font-size:46px; overflow:hidden; }
  .mt-avatar.bot { background:radial-gradient(circle at 50% 35%,#7a6a2c,#2a2410 75%); }
  .mt-avatar.me { background:radial-gradient(circle at 50% 35%,#3d3a78,#12122c 75%); }
  .mt-avatar > span:first-child { opacity:.55; }
  .mt-life { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:Cinzel,serif; font-weight:700; font-size:44px; color:#fff; text-shadow:0 2px 0 #000,0 0 8px #000,0 0 2px #000; }
  .mt-name { display:block; font-size:12px; font-weight:600; padding:4px 0 2px; color:#fff; }
  .mt-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; font-size:10px; }
  .mt-stats span { background:#16233f; border:1px solid #2f4f8f; border-radius:4px; padding:2px 0; color:#cfe0ff; white-space:nowrap; }
  .mt-log { list-style:none; margin:0; background:#0d1018; border:1px solid #2a2f3a; border-radius:8px; padding:8px; font-size:11px; line-height:1.4; color:#8f98a8; max-height:92px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  .mt-cap { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8f98a8; margin-bottom:6px; }
  .mt-bf { border:1px solid #7b8594; border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:8px; min-height:150px; }
  .mt-bf.opp { background:linear-gradient(180deg,#6b7482,#5b6472); }
  .mt-bf.you { background:linear-gradient(180deg,#262d42,#1c2233); border-color:#4a5368; }
  .mt-rows { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:space-between; }
  .mt-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; min-height:64px; }
  .mt-empty { font-size:11px; color:#ffffff80; }
  .mt-bf.opp .mt-empty { color:#11151dbb; }
  .mt-prompt { flex:none; background:#555b66; border:2px solid #e8e8e8; box-shadow:0 0 0 1px #000; align-self:flex-start; width:100%; }
  .mt-prompt-h { background:#06070a; color:#6ea8ff; font-family:Cinzel,serif; font-size:14px; padding:5px 8px; }
  .mt-prompt-b { padding:10px 12px 12px; font-size:12.5px; line-height:1.45; color:#fff; }
  .mt-phases { display:flex; align-items:center; gap:2px; background:#0b0d12; border:1px solid #2a2f3a; border-radius:6px; padding:5px 6px; overflow-x:auto; scrollbar-width:thin; }
  .mt-turn { flex:none; position:sticky; left:-6px; z-index:1; background:#0b0d12; font-size:12px; font-weight:700; color:#fff; padding:3px 8px 3px 6px; white-space:nowrap; }
  .mt-ph { flex:1 0 auto; text-align:center; font-family:Cinzel,serif; font-size:10.5px; color:#8b93a1; padding:3px 6px; border:2px solid transparent; border-radius:8px; white-space:nowrap; }
  .mt-ph.on { color:#fff; border-color:#f0a35a; background:#000; box-shadow:0 0 10px #f0a35a66; }
  .mt-hand { container-type:inline-size; display:flex; gap:8px; background:#0b0d12; border:1px solid #2a2f3a; border-radius:8px; padding:10px 8px; overflow-x:auto; min-height:120px; align-items:flex-start; scrollbar-width:thin; }
  /* cards */
  .mc { --w:70px; position:relative; flex:none; width:var(--w); aspect-ratio:5/7; border-radius:calc(var(--w)*.06); background:#0a0a0a; padding:calc(var(--w)*.045); text-align:left; transition:transform .2s, box-shadow .2s, opacity .2s; }
  .mc.big { --w:clamp(108px, 13cqw, 142px); } .mc.sm { --w:46px; }
  .mc-in { display:flex; flex-direction:column; gap:calc(var(--w)*.02); height:100%; border-radius:calc(var(--w)*.035); padding:calc(var(--w)*.035); overflow:hidden; position:relative; }
  .f-g .mc-in { background:linear-gradient(170deg,#3f7a4e,#1d4a2c); } .f-u .mc-in { background:linear-gradient(170deg,#3f7fb4,#1b456f); }
  .f-r .mc-in { background:linear-gradient(170deg,#b9553c,#6b2416); } .f-l .mc-in { background:linear-gradient(170deg,#7a6a48,#3d3320); }
  .mc-name { display:flex; align-items:center; justify-content:space-between; gap:3px; background:#f1ead8; color:#15120c; border-radius:3px; padding:0 calc(var(--w)*.035); font-weight:700; font-size:calc(var(--w)*.092); line-height:1.5; min-height:calc(var(--w)*.14); }
  .mc-cost { flex:none; width:calc(var(--w)*.115); height:calc(var(--w)*.115); border-radius:50%; background:#c9c2b4; border:1px solid #6d675b; display:flex; align-items:center; justify-content:center; font-size:calc(var(--w)*.08); }
  .mc-art { flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; border:1px solid #0008; border-radius:2px; font-size:calc(var(--w)*.34); }
  .mc-type { background:#f1ead8; color:#15120c; border-radius:3px; padding:0 calc(var(--w)*.035); font-weight:600; font-size:calc(var(--w)*.075); line-height:1.5; }
  .mc-text { flex:0 0 30%; background:#e9e1cc; color:#1b1710; border-radius:2px; padding:calc(var(--w)*.03) calc(var(--w)*.04); font-size:calc(var(--w)*.075); line-height:1.25; overflow:hidden; font-family:"Cormorant Garamond",serif; font-weight:600; }
  .mc:not(.big) .mc-type, .mc.sm .mc-name { display:none; }
  .mc-pt { position:absolute; right:calc(var(--w)*.02); bottom:calc(var(--w)*.02); background:#f1ead8; color:#15120c; border:1px solid #6d675b; border-radius:3px; padding:0 calc(var(--w)*.045); font-weight:700; font-size:calc(var(--w)*.11); line-height:1.35; }
  .mc-tag { position:absolute; top:-7px; right:-5px; z-index:2; background:#0b0812; border:1px solid #c9a24b; border-radius:99px; padding:1px 6px; font-size:9px; color:#e3c77d; white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
  button.mc { cursor:pointer; }
  button.mc:hover { transform:translateY(-5px); box-shadow:0 0 0 2px #c9a24b; }
  .mc.dim { opacity:.5; }
  .mc.tapped { transform:rotate(90deg); margin:0 calc(var(--w)*.2); opacity:.8; }
  .mc.sel { box-shadow:0 0 0 2px #e3c77d, 0 0 18px #c9a24baa; transform:translateY(-8px); }
  .mc.atk { box-shadow:0 0 0 2px #ff7a62, 0 0 18px #e8836aaa; }
  @media (min-width:640px) { .mc { --w:84px; } .mc.sm { --w:52px; } .mt-bf.opp { flex-direction:row; } .mt-prompt { width:250px; } }
  @media (min-width:1024px) {
    .mt { grid-template-columns:176px minmax(0,1fr); }
    .mt-side { display:flex; flex-direction:column; }
    .mt-log { flex:1 1 0; min-height:90px; max-height:none; }
    .mt-gy { display:block; background:#0d1018; border:1px solid #2a2f3a; border-radius:8px; padding:8px; min-height:104px; }
    .mt-avatar { height:104px; } .mt-bf { min-height:210px; }
  }
  @media (prefers-reduced-motion: reduce) { .mc, .mt-player.target { transition:none; animation:none; } }
  .sbtn { padding:.5rem .85rem; border-radius:8px; font-size:.78rem; font-weight:600; transition: all .2s; }
  .sbtn-p { background:#c9a24b; color:#0b0812; } .sbtn-p:hover { background:#e3c77d; }
  .sbtn-s { border:1px solid #6b7280; color:#fff; } .sbtn-s:hover { border-color:#c9a24b; color:#e3c77d; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .reveal { opacity:1; transform:none; }
  }
</style>
</head>

<main id="top">

<!-- HERO -->
<section class="relative overflow-hidden">

<!-- QUIZ -->
<section id="quiz" class="max-w-3xl mx-auto px-5 py-20 sm:py-28 scroll-mt-14">
  <div class="text-center mb-10 reveal">

          </div>
          <div class="card-edge panel p-5 h-[210px] lift">
            <p class="font-display text-parch text-lg leading-tight">${tr(e.n)}</p>

        </div>
      </div>`).join("");
    setCross(crossHidden);
  }
  function setCross(hidden) {
    crossHidden = hidden;
    $("#crossToggle").setAttribute("aria-checked", String(hidden));
    let shown = 0;
    $$(".tl-item").forEach(it => {
      const hide = hidden && it.dataset.cross === "1";
      it.classList.toggle("cross-hidden", hide);
      it.setAttribute("aria-hidden", String(hide));
      if (!hide) shown++;
    });
    $("#tlCount").textContent = tr([`${shown} of ${ERAS.length} eras shown`, `${shown} de ${ERAS.length} eras visíveis`]);
  }
  $("#crossToggle").addEventListener("click", () => setCross(!crossHidden));
  const tlScroll = $("#tlScroll");
  const stepBy = d => tlScroll.scrollBy({ left: d * 640, behavior: "smooth" });
  $("#tlPrev").addEventListener("click", () => stepBy(-1));
  $("#tlNext").addEventListener("click", () => stepBy(1));
  tlScroll.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); stepBy(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); stepBy(-1); }
  });
  let down = false, sx = 0, sl = 0;

  window.addEventListener("pointerup", () => { down = false; });
  window.addEventListener("pointermove", e => { if (down) tlScroll.scrollLeft = sl - (e.clientX - sx); });

  function newDeck() {
    const d = [];

    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
    return d;
  }
  // opening hand: guarantee 3 lands so the tutorial game always gets going
  function newPlayer() {
    const lib = newDeck(), hand = [];
    for (let n = 0; n < 3; n++) hand.push(lib.splice(lib.findIndex(c => c.k === "land"), 1)[0]);
    while (hand.length < 7) hand.push(lib.splice(lib.findIndex(c => c.k !== "land"), 1)[0]);
    return { life: 20, lib, hand, gy: [], lands: 0, tapped: 0, board: [], landPlayed: false };
  }
  function newGame() {
    gid++;
    G = { you: newPlayer(), bot: newPlayer(), turn: "you", phase: "main1", sel: new Set(), atk: [], blocks: {}, pick: null, target: null, log: [], n: 1, step: 3, busy: false, over: null, msg: null };
    log(["New game. You go first, so you skip your first draw.", "Nova partida. Você começa, então pula a primeira compra."]);
    drawSim();
  }
  const log = p => { G.log.unshift(p); if (G.log.length > 30) G.log.pop(); };
  const mana = P => P.lands - P.tapped;
  const alive = c => c.t - c.dmg;
  const canBlock = (b, a) => !b.tapped && (!a.fly || b.fly);
  function drawCard(who) {
    const P = G[who];
    if (!P.lib.length) { G.over = who === "you" ? "lose" : "win"; log(who === "you" ? ["Your library is empty. You lose.", "Seu grimório acabou. Você perde."] : ["The bot's library is empty. You win!", "O grimório do bot acabou. Você vence!"]); return; }
    P.hand.push(P.lib.pop());
  }
  function startTurn(who, skipDraw) {
    const P = G[who];
    G.turn = who; P.tapped = 0; P.landPlayed = false;
    P.board.forEach(c => { c.tapped = false; c.sick = false; });
    [G.you, G.bot].forEach(x => x.board.forEach(c => c.dmg = 0));
    if (!skipDraw) drawCard(who);
  }
  function cleanup() {
    [["you", ["Your", "Seu"]], ["bot", ["The bot's", "Do bot:"]]].forEach(([w]) => {
      G[w].board = G[w].board.filter(c => {
        if (c.dmg < c.t) return true;
        log(w === "you" ? [`Your ${c.n[0]} dies.`, `Seu ${c.n[1]} morre.`] : [`The bot's ${c.n[0]} dies.`, `${c.n[1]} do bot morre.`]);
        G[w].gy.push({ ...c, tapped: false, dmg: 0 });
        return false;
      });
    });

    $$("[data-t]").forEach(el => { el.innerHTML = tr(S[el.dataset.t]); });
    $$(".langBtn").forEach(b => {
      const on = (b.dataset.lang === "pt") === !!li;
      b.setAttribute("aria-pressed", String(on));
      b.className = "langBtn px-3 py-1.5 transition " + (on ? "bg-gold text-void" : "text-mute hover:text-gold-soft");
    });
    renderTimeline(); renderQuiz(); renderSets(); renderLore(); renderPlanes(); renderColors();
    renderAnat(); renderTypes(); renderPhases(); renderStack(); renderZones(); drawCounters(); renderThen();
    renderFormats(); renderStart(); drawSim();
    $$(".reveal").forEach(observe);
  }
  $$(".langBtn").forEach(b => b.addEventListener("click", () => {
    li = b.dataset.lang === "pt" ? 1 : 0;
    try { localStorage.setItem("mtgLang", li ? "pt" : "en"); } catch (e) {}
    renderAll();
  }));
  document.addEventListener("click", e => {
    const a = e.target.closest("a.go"); if (!a) return;
    e.preventDefault();
    $(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
  });

  newGame();
  renderAll();
})();
</script>
</body>
</html>
